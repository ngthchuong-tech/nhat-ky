<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f6f5c">
<title>Bán trú</title>
<style>
  :root {
    --bg: #f4f6f5; --card: #ffffff; --text: #1d2521; --muted: #66706b; --line: #e2e7e4;
    --brand: #1f6f5c; --brand-soft: #e3f1ec; --warn: #b4541a; --warn-soft: #fcefe6;
    --ok: #237a3b; --ok-soft: #e5f4e8; --danger: #b3261e; --danger-soft: #fbe9e7;
    --radius: 14px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  .app { max-width: 760px; margin: 0 auto; padding: 0 16px calc(84px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 0 10px;
    display: flex; align-items: center; gap: 10px; }
  header h1 { font-size: 20px; margin: 0; flex: 1; }
  select.thang { padding: 8px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 12px; }
  .grid2 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 12px; margin-bottom: 12px; }
  .grid2 .card { margin: 0; }
  .stat .lbl { color: var(--muted); font-size: 14px; }
  .stat .val { font-size: clamp(17px, 5vw, 22px); overflow-wrap: anywhere; font-weight: 700; margin-top: 2px; }
  .stat .sub { color: var(--muted); font-size: 13px; }
  .red { color: var(--danger); } .green { color: var(--ok); } .orange { color: var(--warn); }
  h2 { font-size: 17px; margin: 18px 0 10px; }
  .btn { border: 0; border-radius: 10px; padding: 11px 14px; background: var(--brand); color: #fff; font-weight: 600; cursor: pointer; }
  .btn.sec { background: var(--brand-soft); color: var(--brand); }
  .btn.ghost { background: transparent; border: 1px solid var(--line); color: var(--text); }
  .btn.danger { background: var(--danger-soft); color: var(--danger); }
  .btn.full { width: 100%; }
  .btn:disabled { opacity: .5; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row.wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }
  .banner { background: var(--warn-soft); color: var(--warn); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 12px; }
  .banner .btn { margin-top: 8px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; }
  .tabs button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 7px 14px; white-space: nowrap; cursor: pointer; }
  .tabs button.on { background: var(--brand); color: #fff; border-color: var(--brand); }
  .item { display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: var(--card);
    border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 8px; cursor: pointer; }
  .item .name { font-weight: 600; }
  .item .meta { color: var(--muted); font-size: 14px; }
  .item .amt { text-align: right; font-weight: 700; white-space: nowrap; }
  .avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--brand-soft); color: var(--brand);
    display: grid; place-items: center; font-weight: 700; flex: none; }
  .tag { display: inline-block; font-size: 12px; padding: 2px 8px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); margin: 2px 4px 0 0; }
  .tag.no { background: var(--danger-soft); color: var(--danger); border-color: transparent; }
  .tag.ok { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
  .tag.part { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; flex: none; }
  .seg button { border: 0; background: var(--card); padding: 9px 14px; cursor: pointer; }
  .seg button.co.on { background: var(--ok); color: #fff; }
  .seg button.vang.on { background: var(--danger); color: #fff; }
  input[type=text], input[type=tel], input[type=url], input[type=password], input[type=date], input[type=number], input[type=search] {
    width: 100%; padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); }
  label.f { display: block; font-size: 14px; color: var(--muted); margin: 10px 0 4px; }
  nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line);
    display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); z-index: 10; }
  nav.bottom .in { display: flex; width: 100%; max-width: 760px; }
  nav.bottom button { flex: 1; border: 0; background: none; padding: 9px 2px 10px; font-size: 12px; color: var(--muted); cursor: pointer; }
  nav.bottom button svg { display: block; margin: 0 auto 2px; width: 22px; height: 22px; }
  nav.bottom button.on { color: var(--brand); font-weight: 600; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.35); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  .modal.show { display: flex; }
  .sheet { background: var(--card); width: 100%; max-width: 560px; max-height: 92vh; overflow: auto;
    border-radius: 18px 18px 0 0; padding: 18px 16px calc(18px + env(safe-area-inset-bottom)); }
  @media (min-width: 700px) { .modal { align-items: center; } .sheet { border-radius: 18px; } }
  .sheet h3 { margin: 0 0 4px; font-size: 19px; }
  .line { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  .line:last-child { border-bottom: 0; }
  .line.total { font-weight: 700; border-top: 1px solid var(--line); border-bottom: 0; margin-top: 4px; }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .empty { text-align: center; color: var(--muted); padding: 28px 10px; }
  .toast { position: fixed; left: 50%; bottom: calc(92px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: #1d2521; color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 30; max-width: 90vw; display: none; }
  .loading { position: fixed; inset: 0; background: rgba(255,255,255,.6); display: none; place-items: center; z-index: 40; }
  .loading.show { display: grid; }
  .spin { width: 36px; height: 36px; border: 4px solid var(--brand-soft); border-top-color: var(--brand); border-radius: 50%; animation: s 0.8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
  pre.msg { white-space: pre-wrap; background: var(--bg); border-radius: 10px; padding: 12px; font: 14px/1.5 inherit; margin: 8px 0; }
  .f2 { display: grid; grid-template-columns: 1fr; gap: 0 12px; }
  .f2.in { grid-template-columns: minmax(0,1fr) minmax(0,1.3fr); }
  @media (min-width: 560px) { .f2 { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } }
  .f3 { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 0 10px; }
  .f3 > div:first-child { grid-column: 1 / -1; }
  @media (min-width: 560px) { .f3 { grid-template-columns: repeat(3, minmax(0,1fr)); } .f3 > div:first-child { grid-column: auto; } }
  details summary { cursor: pointer; color: var(--muted); padding: 6px 0; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 id="tieuDe">Bán trú</h1>
    <select class="thang" id="chonThang" aria-label="Chọn tháng"></select>
  </header>
  <main id="noiDung"></main>
</div>

<nav class="bottom"><div class="in" id="menu"></div></nav>

<div class="modal" id="modal"><div class="sheet" id="modalNoiDung"></div></div>
<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div class="spin"></div></div>

<script>
/* ================== CẤU HÌNH & TIỆN ÍCH ================== */
const LUU = 'bantru_cauhinh_v3';
let cauHinh = {};
try { cauHinh = JSON.parse(localStorage.getItem(LUU) || '{}'); } catch (e) { cauHinh = {}; }

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tien = n => String(Math.round(n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + 'đ';
const pad = n => String(n).padStart(2, '0');
const soThang = t => { const [m, y] = t.split('/').map(Number); return y * 12 + m; };
const thangKe = t => { let [m, y] = t.split('/').map(Number); m++; if (m > 12) { m = 1; y++; } return pad(m) + '/' + y; };
const homNayChu = () => { const d = new Date(); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + '/' + d.getFullYear(); };
const thangHienTai = () => { const d = new Date(); return pad(d.getMonth() + 1) + '/' + d.getFullYear(); };
const chuSangNgay = s => { const [d, m, y] = s.split('/').map(Number); return new Date(y, m - 1, d); };
const isoSangChu = s => { const [y, m, d] = s.split('-'); return d + '/' + m + '/' + y; };
const chuSangIso = s => { const [d, m, y] = s.split('/'); return y + '-' + m + '-' + d; };
const chuCaiDau = ten => { const p = String(ten).trim().split(/\s+/); return (p[p.length - 1] || '?')[0].toUpperCase(); };
const laDienThoai = () => /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

function baoToast(s, ms = 2600) {
  const t = $('#toast'); t.textContent = s; t.style.display = 'block';
  clearTimeout(baoToast._t); baoToast._t = setTimeout(() => t.style.display = 'none', ms);
}
function dangTai(b) { $('#loading').classList.toggle('show', b); }

async function goiApi(action, thamSo = {}) {
  if (!cauHinh.url) throw new Error('Chưa nhập đường link ở mục Cài đặt');
  const res = await fetch(cauHinh.url, { method: 'POST', body: JSON.stringify(Object.assign({ key: cauHinh.key, action }, thamSo)) });
  const kq = await res.json();
  if (!kq.ok) throw new Error(kq.loi || 'Lỗi không rõ');
  return kq.data;
}

async function chay(viec, thongBaoXong) {
  dangTai(true);
  try { const kq = await viec(); if (thongBaoXong) baoToast(thongBaoXong); return kq; }
  catch (e) { baoToast('Lỗi: ' + e.message, 5000); throw e; }
  finally { dangTai(false); }
}

/* ================== DỮ LIỆU ================== */
let D = null;          // dữ liệu từ Google Sheet
let thang = '';        // tháng đang xem
let manHinh = 'tongQuan';

async function taiDuLieu(giuThang = true) {
  D = await chay(() => goiApi('tongHop'));
  D.hsTheoId = {}; D.hocSinh.forEach(h => D.hsTheoId[h.id] = h);
  D.dvTheoMa = {}; D.dichVu.forEach(d => D.dvTheoMa[d.ma] = d);
  const ds = [...new Set(D.dangKy.map(x => x.thang).concat(D.phaiThu.map(x => x.thang)))].filter(Boolean).sort((a, b) => soThang(a) - soThang(b));
  D.dsThang = ds;
  if (!giuThang || !ds.includes(thang)) thang = ds.includes(thangHienTai()) ? thangHienTai() : (ds[ds.length - 1] || thangHienTai());
  veChonThang();
  ve();
}

function veChonThang() {
  const ds = D ? D.dsThang : [];
  $('#chonThang').innerHTML = ds.slice().reverse().map(t => `<option ${t === thang ? 'selected' : ''}>${t}</option>`).join('') || `<option>${thangHienTai()}</option>`;
}
$('#chonThang').addEventListener('change', e => { thang = e.target.value; ve(); });

/** Tiền phải thu / đã thu / còn thiếu của 1 học sinh trong 1 tháng */
function soLieu(hsId, t) {
  const phai = D.phaiThu.filter(x => x.hsId === hsId && x.thang === t).reduce((s, x) => s + x.thanhTien, 0);
  const da = D.thuTien.filter(x => x.hsId === hsId && x.thang === t).reduce((s, x) => s + x.soTien, 0);
  return { phai, da, thieu: phai - da };
}
/** Các tháng TRƯỚC tháng t còn thiếu tiền */
function noCu(hsId, t) {
  const cacThang = [...new Set(D.phaiThu.filter(x => x.hsId === hsId && soThang(x.thang) < soThang(t)).map(x => x.thang))].sort((a, b) => soThang(a) - soThang(b));
  return cacThang.map(x => ({ thang: x, ...soLieu(hsId, x) })).filter(x => x.thieu > 0);
}
function hsTrongThang(t) {
  const ids = [...new Set(D.phaiThu.filter(x => x.thang === t).map(x => x.hsId).concat(D.dangKy.filter(x => x.thang === t).map(x => x.hsId)))];
  return ids.map(id => D.hsTheoId[id] || { id, hoTen: id, sdt: '' });
}
function hsCoNo(t) {   // HS không có dịch vụ tháng t nhưng còn nợ tháng trước
  const trong = new Set(hsTrongThang(t).map(h => h.id));
  return D.hocSinh.filter(h => !trong.has(h.id) && noCu(h.id, t).length > 0);
}
function daTinhPhi(t) { return D.phaiThu.some(x => x.thang === t); }
function dvTheoNgay(ma) { const d = D.dvTheoMa[ma]; return d && d.cachTinh.toLowerCase() === 'theo ngày'; }

/* ================== KHUNG & MENU ================== */
const MENU = [
  ['tongQuan', 'Tổng quan', '<path d="M3 13h8V3H3zM13 21h8V11h-8zM3 21h8v-6H3zM13 3v6h8V3z"/>'],
  ['diemDanh', 'Điểm danh', '<path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/>'],
  ['thuPhi', 'Thu phí', '<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>'],
  ['hocSinh', 'Học sinh', '<circle cx="9" cy="8" r="4"/><path d="M1 21v-1a7 7 0 0 1 14 0v1M17 11a3 3 0 1 0 0-6M23 21v-1a6 6 0 0 0-4-5.6"/>'],
  ['caiDat', 'Cài đặt', '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>']
];
function veMenu() {
  $('#menu').innerHTML = MENU.map(([k, ten, icon]) =>
    `<button class="${k === manHinh ? 'on' : ''}" data-k="${k}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>${ten}</button>`).join('');
  document.querySelectorAll('#menu button').forEach(b => b.onclick = () => { manHinh = b.dataset.k; ve(); window.scrollTo(0, 0); });
}

function ve() {
  veMenu();
  const ten = MENU.find(m => m[0] === manHinh)[1];
  $('#tieuDe').textContent = manHinh === 'tongQuan' ? 'Bán trú' : ten;
  $('#chonThang').style.visibility = (manHinh === 'caiDat' || manHinh === 'diemDanh' || !D) ? 'hidden' : 'visible';
  if (!D && manHinh !== 'caiDat') {
    $('#noiDung').innerHTML = `<div class="card"><p>Chưa kết nối với Google Sheet.</p><button class="btn" onclick="manHinh='caiDat';ve()">Mở Cài đặt</button></div>`;
    return;
  }
  ({ tongQuan: veTongQuan, diemDanh: veDiemDanh, thuPhi: veThuPhi, hocSinh: veHocSinh, caiDat: veCaiDat })[manHinh]();
}

/* ================== TỔNG QUAN ================== */
function veTongQuan() {
  const ds = hsTrongThang(thang);
  let phai = 0, da = 0, soChua = 0;
  ds.forEach(h => { const s = soLieu(h.id, thang); phai += s.phai; da += s.da; if (s.thieu > 0) soChua++; });
  let noTruoc = 0, soHsNo = 0;
  D.hocSinh.forEach(h => { const n = noCu(h.id, thang); if (n.length) { soHsNo++; noTruoc += n.reduce((s, x) => s + x.thieu, 0); } });

  const hn = homNayChu();
  const hsNgay = hsBanTruNgay(hn);
  const coMat = hsNgay.filter(h => trangThaiDD(hn, h.id) === 'Có').length;
  const daDD = hsNgay.some(h => trangThaiDD(hn, h.id));

  const moiNhat = D.dsThang[D.dsThang.length - 1];
  let tiepTheo = moiNhat ? thangKe(moiNhat) : thangHienTai();
  if (soThang(thangHienTai()) > soThang(tiepTheo)) tiepTheo = thangHienTai();   // nghỉ hè: nhảy thẳng tới tháng hiện tại

  $('#noiDung').innerHTML = `
    ${!daTinhPhi(thang) ? `<div class="banner">Tháng ${thang} chưa tính phí.<br><button class="btn" onclick="tinhPhi()">Tính phí tháng ${thang}</button></div>` : ''}
    <div class="grid2">
      <div class="card stat"><div class="lbl">Phải thu tháng ${thang}</div><div class="val">${tien(phai)}</div><div class="sub">${ds.length} học sinh</div></div>
      <div class="card stat"><div class="lbl">Đã thu</div><div class="val green">${tien(da)}</div><div class="sub">${phai ? Math.round(da / phai * 100) : 0}% số phải thu</div></div>
      <div class="card stat"><div class="lbl">Còn thiếu tháng này</div><div class="val ${phai - da > 0 ? 'red' : ''}">${tien(phai - da)}</div><div class="sub">${soChua} học sinh chưa đóng đủ</div></div>
      <div class="card stat"><div class="lbl">Nợ các tháng trước</div><div class="val ${noTruoc > 0 ? 'orange' : ''}">${tien(noTruoc)}</div><div class="sub">${soHsNo} học sinh</div></div>
    </div>
    <div class="card row">
      <div class="grow"><div class="name">Điểm danh hôm nay (${hn})</div>
        <div class="muted small">${hsNgay.length ? (daDD ? `${coMat}/${hsNgay.length} em bán trú ngày có mặt` : `Chưa điểm danh · ${hsNgay.length} em bán trú ngày`) : 'Hôm nay không có em nào bán trú tính ngày'}</div></div>
      ${hsNgay.length ? `<button class="btn sec" onclick="manHinh='diemDanh';ve()">Điểm danh</button>` : ''}
    </div>
    <div class="card">
      <div class="name">Việc hàng tháng</div>
      <p class="muted small" style="margin:4px 0 10px">Đầu tháng: tạo đăng ký tháng mới (chép từ tháng trước, bỏ các em đã nghỉ giữa tháng). Sửa thêm/bớt dịch vụ trong Google Sheet nếu cần, rồi bấm Tính phí.</p>
      <div class="row wrap">
        <button class="btn sec" onclick="taoThangMoi('${moiNhat || ''}','${tiepTheo}')" ${moiNhat ? '' : 'disabled'}>Tạo tháng ${tiepTheo}</button>
        <button class="btn ghost" onclick="tinhPhi()">Tính lại phí ${thang}</button>
      </div>
    </div>`;
}

async function tinhPhi(t = thang) {
  await chay(() => goiApi('tinhPhi', { thang: t }), 'Đã tính phí tháng ' + t);
  await taiDuLieu();
}
async function taoThangMoi(tu, den) {
  const chon = prompt(`Tạo đăng ký tháng ${den} bằng cách chép từ tháng nào?\n(Các tháng đang có: ${D.dsThang.join(', ')})`, tu);
  if (chon === null) return;
  tu = chon.trim();
  if (!D.dsThang.includes(tu)) { baoToast('Không có dữ liệu tháng ' + tu, 4000); return; }
  const kq = await chay(() => goiApi('saoChepDangKy', { tuThang: tu, denThang: den }));
  await chay(() => goiApi('tinhPhi', { thang: den }));
  thang = den;
  await taiDuLieu();
  baoToast(`Đã tạo ${kq.soDong} đăng ký tháng ${den}` + (kq.boQua.length ? ` · bỏ qua ${kq.boQua.length} dịch vụ đã ngừng` : ''), 5000);
}

/* ================== ĐIỂM DANH ================== */
let ngayDD = homNayChu();
let nhapDD = {};   // hsId -> 'Có' | 'Vắng' (chưa lưu)

function hsBanTruNgay(ngayChu) {
  const d = chuSangNgay(ngayChu);
  const t = pad(d.getMonth() + 1) + '/' + d.getFullYear();
  const ids = new Set();
  D.dangKy.filter(x => x.thang === t && dvTheoNgay(x.maDv)).forEach(x => {
    const tu = x.tuNgay ? chuSangNgay(x.tuNgay) : null, den = x.denNgay ? chuSangNgay(x.denNgay) : null;
    if ((!tu || d >= tu) && (!den || d <= den)) ids.add(x.hsId);
  });
  return [...ids].map(id => D.hsTheoId[id] || { id, hoTen: id }).sort((a, b) => a.hoTen.localeCompare(b.hoTen, 'vi'));
}
function trangThaiDD(ngayChu, hsId) {
  const r = D.diemDanh.filter(x => x.ngay === ngayChu && x.hsId === hsId);
  return r.length ? r[r.length - 1].trangThai : '';
}
function soNgayCoTrongThang(hsId, ngayChu) {
  const [, m, y] = ngayChu.split('/');
  const ngay = new Set(D.diemDanh.filter(x => x.hsId === hsId && x.trangThai.toLowerCase() === 'có' && x.ngay.endsWith('/' + m + '/' + y)).map(x => x.ngay));
  return ngay.size;
}

function veDiemDanh() {
  const ds = hsBanTruNgay(ngayDD);
  const d = chuSangNgay(ngayDD);
  const thu = ['Chủ nhật', 'Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7'][d.getDay()];
  const ht = id => nhapDD[id] || trangThaiDD(ngayDD, id);
  const daCo = ds.filter(h => ht(h.id) === 'Có').length;
  const chuaChon = ds.filter(h => !ht(h.id)).length;
  const coThayDoi = Object.keys(nhapDD).length > 0;

  $('#noiDung').innerHTML = `
    <div class="card">
      <label class="f" for="ngayDD" style="margin-top:0">Ngày điểm danh (${thu})</label>
      <input type="date" id="ngayDD" value="${chuSangIso(ngayDD)}">
      <p class="muted small" style="margin:8px 0 0">Chỉ hiện các em bán trú tính theo ngày. Các dịch vụ tính theo tháng không cần điểm danh.</p>
    </div>
    ${ds.length ? `
      <div class="row" style="margin-bottom:10px">
        <div class="grow muted small">Có mặt: <b>${daCo}/${ds.length}</b>${chuaChon ? ` · chưa chọn: ${chuaChon}` : ''}</div>
        <button class="btn ghost" id="tatCaCo">Tất cả có mặt</button>
      </div>
      ${ds.map(h => { const v = ht(h.id); return `
        <div class="item" style="cursor:default">
          <div class="avatar">${esc(chuCaiDau(h.hoTen))}</div>
          <div class="grow"><div class="name">${esc(h.hoTen)}</div><div class="meta">Tháng này đã có mặt ${soNgayCoTrongThang(h.id, ngayDD)} ngày</div></div>
          <div class="seg"><button class="co ${v === 'Có' ? 'on' : ''}" data-id="${esc(h.id)}" data-v="Có">Có</button><button class="vang ${v === 'Vắng' ? 'on' : ''}" data-id="${esc(h.id)}" data-v="Vắng">Vắng</button></div>
        </div>`; }).join('')}
      <button class="btn full" id="luuDD" ${coThayDoi ? '' : 'disabled'} style="margin-top:6px">Lưu điểm danh</button>
      <p class="muted small">Sau khi lưu, app tự tính lại tiền tháng này.</p>`
    : `<div class="empty">Ngày này không có em nào bán trú tính theo ngày.</div>`}`;

  $('#ngayDD').onchange = e => {
    if (!e.target.value) return;
    if (Object.keys(nhapDD).length && !confirm('Bỏ các thay đổi chưa lưu?')) { e.target.value = chuSangIso(ngayDD); return; }
    ngayDD = isoSangChu(e.target.value); nhapDD = {}; veDiemDanh();
  };
  document.querySelectorAll('.seg button').forEach(b => b.onclick = () => { nhapDD[b.dataset.id] = b.dataset.v; veDiemDanh(); });
  const tc = $('#tatCaCo'); if (tc) tc.onclick = () => { ds.forEach(h => nhapDD[h.id] = 'Có'); veDiemDanh(); };
  const luu = $('#luuDD'); if (luu) luu.onclick = luuDiemDanh;
}

async function luuDiemDanh() {
  const ds = Object.keys(nhapDD).map(hsId => ({ hsId, trangThai: nhapDD[hsId] }));
  if (!ds.length) return;
  const d = chuSangNgay(ngayDD);
  const t = pad(d.getMonth() + 1) + '/' + d.getFullYear();
  await chay(() => goiApi('luuDiemDanh', { ngay: ngayDD, ds }));
  await chay(() => goiApi('tinhPhi', { thang: t }));
  nhapDD = {};
  await taiDuLieu();
  baoToast('Đã lưu điểm danh ' + ngayDD);
}

/* ================== THU PHÍ ================== */
let locThuPhi = 'chua';

function veThuPhi() {
  const ds = hsTrongThang(thang).concat(hsCoNo(thang)).map(h => {
    const s = soLieu(h.id, thang); const n = noCu(h.id, thang);
    const tongNo = n.reduce((a, x) => a + x.thieu, 0);
    return { h, s, n, tongNo, canDong: Math.max(s.thieu, 0) + tongNo };
  }).sort((a, b) => a.h.hoTen.localeCompare(b.h.hoTen, 'vi'));

  const chua = ds.filter(x => x.canDong > 0), du = ds.filter(x => x.canDong <= 0);
  const hien = locThuPhi === 'chua' ? chua : locThuPhi === 'du' ? du : ds;

  $('#noiDung').innerHTML = `
    ${!daTinhPhi(thang) ? `<div class="banner">Tháng ${thang} chưa tính phí.<br><button class="btn" onclick="tinhPhi()">Tính phí tháng ${thang}</button></div>` : ''}
    <div class="tabs">
      <button class="${locThuPhi === 'chua' ? 'on' : ''}" data-l="chua">Chưa đóng đủ (${chua.length})</button>
      <button class="${locThuPhi === 'du' ? 'on' : ''}" data-l="du">Đã đóng đủ (${du.length})</button>
      <button class="${locThuPhi === 'all' ? 'on' : ''}" data-l="all">Tất cả (${ds.length})</button>
    </div>
    ${hien.length ? hien.map(x => {
      const trangThai = x.canDong <= 0 ? '<span class="tag ok">Đã đóng đủ</span>'
        : x.s.da > 0 && x.s.thieu > 0 ? '<span class="tag part">Đóng thiếu</span>'
        : x.s.thieu > 0 ? '<span class="tag no">Chưa đóng</span>' : '';
      const daGui = D.daGui[thang + '|' + x.h.id];
      return `
      <div class="item" data-id="${esc(x.h.id)}">
        <div class="avatar">${esc(chuCaiDau(x.h.hoTen))}</div>
        <div class="grow">
          <div class="name">${esc(x.h.hoTen)}</div>
          <div class="meta">Tháng ${thang}: ${tien(x.s.phai)}${x.s.da ? ' · đã đóng ' + tien(x.s.da) : ''}</div>
          <div>${trangThai}${x.n.length ? `<span class="tag part">Nợ ${x.n.length} tháng trước: ${tien(x.tongNo)}</span>` : ''}${daGui ? '<span class="tag">Đã nhắn Zalo</span>' : ''}</div>
        </div>
        <div class="amt ${x.canDong > 0 ? 'red' : 'green'}">${x.canDong > 0 ? tien(x.canDong) : '✓'}</div>
      </div>`; }).join('')
    : `<div class="empty">${locThuPhi === 'chua' ? 'Tất cả đã đóng đủ.' : 'Không có học sinh nào.'}</div>`}`;

  document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { locThuPhi = b.dataset.l; veThuPhi(); });
  document.querySelectorAll('.item[data-id]').forEach(el => el.onclick = () => moHocSinh(el.dataset.id));
}

function chiTietThang(hsId, t) {
  return D.phaiThu.filter(x => x.hsId === hsId && x.thang === t).map(x => {
    const dv = D.dvTheoMa[x.maDv]; const ten = dv ? dv.ten : x.maDv;
    if (dvTheoNgay(x.maDv)) return { ten: `${ten} (${x.soLuong} ngày × ${tien(x.mucPhi)})`, tien: x.thanhTien };
    return { ten: ten + (x.soLuong > 0 && x.soLuong < 1 ? ' (nửa tháng)' : ''), tien: x.thanhTien };
  });
}

function noiDungZalo(hsId) {
  const h = D.hsTheoId[hsId] || { hoTen: hsId };
  const s = soLieu(hsId, thang), n = noCu(hsId, thang);
  const ct = chiTietThang(hsId, thang);
  const tongNo = n.reduce((a, x) => a + x.thieu, 0);
  let m = `Kính gửi phụ huynh em ${h.hoTen},\n\n`;
  if (ct.length) {
    m += `Học phí tháng ${thang}:\n` + ct.map(x => `- ${x.ten}: ${tien(x.tien)}`).join('\n') + '\n';
    m += `Tổng phải đóng: ${tien(s.phai)}\n`;
    if (s.da) m += `Đã đóng: ${tien(s.da)}\n`;
    m += `Còn thiếu: ${tien(Math.max(s.thieu, 0))}\n`;
  }
  if (n.length) {
    m += `\nNợ các tháng trước:\n` + n.map(x => `- Tháng ${x.thang}: ${tien(x.thieu)}`).join('\n') + '\n';
  }
  m += `\nTỔNG SỐ TIỀN CẦN ĐÓNG: ${tien(Math.max(s.thieu, 0) + tongNo)}\n\nCô cảm ơn phụ huynh!`;
  return m;
}

async function saoChep(s) {
  try { await navigator.clipboard.writeText(s); return true; }
  catch (e) {
    const ta = document.createElement('textarea'); ta.value = s; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    let ok = false; try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove(); return ok;
  }
}

async function nhanZalo(hsId) {
  const h = D.hsTheoId[hsId] || {};
  const ok = await saoChep(noiDungZalo(hsId));   // chép TRƯỚC rồi mới mở Zalo
  goiApi('danhDauDaGui', { thang, hsId }).then(() => { D.daGui[thang + '|' + hsId] = true; }).catch(() => {});
  if (!h.sdt) { baoToast(ok ? 'Đã chép tin nhắn. Học sinh chưa có SĐT phụ huynh trong sheet HOC_SINH.' : 'Không chép được, hãy bôi đen và chép tay.', 4500); return; }
  baoToast(ok ? 'Đã chép tin nhắn — dán vào Zalo' : 'Không chép được tự động');
  const link = 'https://zalo.me/' + h.sdt;
  setTimeout(() => { if (laDienThoai()) location.href = link; else window.open(link, '_blank'); }, 400);
}

/* ---------- Hộp chi tiết 1 học sinh (thu tiền, Zalo, lịch sử) ---------- */
function moHocSinh(hsId) {
  const h = D.hsTheoId[hsId] || { id: hsId, hoTen: hsId, sdt: '' };
  const s = soLieu(hsId, thang), n = noCu(hsId, thang);
  const ct = chiTietThang(hsId, thang);
  const tongNo = n.reduce((a, x) => a + x.thieu, 0);
  const canDong = Math.max(s.thieu, 0) + tongNo;
  const lichSu = D.thuTien.filter(x => x.hsId === hsId).slice().reverse();
  const nhomLS = {};
  lichSu.forEach(x => { const g = x.id.replace(/_\d+$/, ''); (nhomLS[g] = nhomLS[g] || { ngay: x.ngayThu, tong: 0, thang: [] }); nhomLS[g].tong += x.soTien; nhomLS[g].thang.push(x.thang); });

  $('#modalNoiDung').innerHTML = `
    <div class="row"><h3 class="grow">${esc(h.hoTen)}</h3><button class="btn ghost" onclick="dongModal()">Đóng</button></div>
    <div class="row small"><span class="muted grow">${h.sdt ? 'SĐT: ' + esc(h.sdt) : 'Chưa có SĐT phụ huynh'}</span>
      <button class="btn ghost" style="padding:6px 10px" onclick="moSuaHocSinh('${esc(hsId)}')">Sửa hồ sơ & dịch vụ</button></div>

    <h2>Tháng ${thang}</h2>
    ${ct.length ? ct.map(x => `<div class="line"><span>${esc(x.ten)}</span><span>${tien(x.tien)}</span></div>`).join('') : '<div class="muted small">Không có dịch vụ tháng này</div>'}
    ${ct.length ? `<div class="line total"><span>Phải đóng</span><span>${tien(s.phai)}</span></div>
      <div class="line"><span>Đã đóng</span><span class="green">${tien(s.da)}</span></div>
      <div class="line"><span>Còn thiếu</span><span class="${s.thieu > 0 ? 'red' : ''}">${tien(Math.max(s.thieu, 0))}</span></div>` : ''}

    ${n.length ? `<h2>Nợ các tháng trước</h2>${n.map(x => `<div class="line"><span>Tháng ${x.thang}</span><span class="orange">${tien(x.thieu)}</span></div>`).join('')}` : ''}

    <div class="card" style="margin-top:14px;background:var(--bg)">
      <div class="line total" style="border:0;margin:0;padding:0"><span>Tổng cần đóng</span><span class="${canDong > 0 ? 'red' : 'green'}">${tien(canDong)}</span></div>
    </div>

    ${canDong > 0 ? `
      <button class="btn full" id="dongDu">Xác nhận đã đóng đủ ${tien(canDong)}</button>
      <details style="margin-top:8px"><summary>Đóng số tiền khác (đóng thiếu / đóng dư)</summary>
        <label class="f" for="soTienKhac">Số tiền phụ huynh đưa</label>
        <input type="number" id="soTienKhac" inputmode="numeric" placeholder="Ví dụ 1000000" min="0" step="1000">
        <p class="muted small" style="margin:6px 0">Tiền được trừ vào tháng nợ cũ nhất trước, phần dư tính vào tháng ${thang}.</p>
        <button class="btn sec full" id="dongKhac">Lưu số tiền này</button>
      </details>` : ''}
    <label class="f" for="ngayThu">Ngày thu</label>
    <input type="date" id="ngayThu" value="${chuSangIso(homNayChu())}">

    <h2>Tin nhắn Zalo</h2>
    <pre class="msg">${esc(noiDungZalo(hsId))}</pre>
    <div class="row wrap"><button class="btn" onclick="nhanZalo('${esc(hsId)}')">Chép & mở Zalo</button>
      <button class="btn ghost" onclick="saoChep(noiDungZalo('${esc(hsId)}')).then(ok=>baoToast(ok?'Đã chép tin nhắn':'Không chép được'))">Chỉ chép</button></div>

    ${Object.keys(nhomLS).length ? `<h2>Lịch sử đóng tiền</h2>${Object.keys(nhomLS).map(g => `
      <div class="line"><span>${esc(nhomLS[g].ngay)} · ${tien(nhomLS[g].tong)}<br><span class="muted small">cho tháng ${[...new Set(nhomLS[g].thang)].join(', ')}</span></span>
      <button class="btn danger" data-xoa="${esc(g)}">Xóa</button></div>`).join('')}` : ''}
  `;
  $('#modal').classList.add('show');

  const layNgay = () => { const v = $('#ngayThu').value; return v ? isoSangChu(v) : homNayChu(); };
  const dsNo = () => n.map(x => ({ thang: x.thang, thieu: x.thieu })).concat(s.thieu > 0 ? [{ thang, thieu: s.thieu }] : []);
  const du = $('#dongDu');
  if (du) du.onclick = () => luuThuTien(hsId, dsNo().map(x => ({ thang: x.thang, hsId, soTien: x.thieu })), layNgay(), 'Đóng đủ');
  const khac = $('#dongKhac');
  if (khac) khac.onclick = () => {
    let con = Number($('#soTienKhac').value || 0);
    if (!(con > 0)) { baoToast('Nhập số tiền trước'); return; }
    const ds = [];
    dsNo().forEach(x => { if (con <= 0) return; const tra = Math.min(con, x.thieu); ds.push({ thang: x.thang, hsId, soTien: tra }); con -= tra; });
    if (con > 0) { const cur = ds.find(x => x.thang === thang); if (cur) cur.soTien += con; else ds.push({ thang, hsId, soTien: con }); }
    luuThuTien(hsId, ds, layNgay(), con > 0 ? 'Đóng dư' : 'Đóng một phần');
  };
  document.querySelectorAll('[data-xoa]').forEach(b => b.onclick = async () => {
    if (!confirm('Xóa lần đóng tiền này?')) return;
    await chay(() => goiApi('xoaThuTien', { id: b.dataset.xoa }), 'Đã xóa');
    await taiDuLieu(); moHocSinh(hsId);
  });
}
async function luuThuTien(hsId, ds, ngayThu, ghiChu) {
  await chay(() => goiApi('thuTien', { ds, ngayThu, ghiChu }), 'Đã lưu tiền thu');
  await taiDuLieu();
  moHocSinh(hsId);
}
function dongModal() { $('#modal').classList.remove('show'); }
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') dongModal(); });

/* ================== HỌC SINH ================== */
let timHS = '';
function veHocSinh() {
  const trong = hsTrongThang(thang);
  const idTrong = new Set(trong.map(h => h.id));
  const khac = D.hocSinh.filter(h => !idTrong.has(h.id));
  const khop = h => !timHS || h.hoTen.toLowerCase().includes(timHS.toLowerCase()) || h.id.toLowerCase().includes(timHS.toLowerCase());
  const the = h => {
    const dk = D.dangKy.filter(x => x.hsId === h.id && x.thang === thang);
    const dvChu = dk.map(x => {
      const dv = D.dvTheoMa[x.maDv];
      let ten = dv ? dv.ten : x.maDv;
      if (dv && !dvTheoNgay(x.maDv) && x.mucPhi !== dv.mucPhi) ten += ' ' + tien(x.mucPhi);        // chỉ ghi giá khi là giá riêng
      if (x.tuNgay && !x.tuNgay.startsWith('01/')) ten += ' (từ ' + x.tuNgay.slice(0, 5) + ')';
      if (x.denNgay && x.denNgay !== cuoiThangChu(thang)) ten += ' (nghỉ ' + x.denNgay.slice(0, 5) + ')';
      return ten;
    }).join(' · ');
    const tong = soLieu(h.id, thang).phai;
    return `<div class="item" data-id="${esc(h.id)}"><div class="avatar">${esc(chuCaiDau(h.hoTen))}</div>
      <div class="grow"><div class="name">${esc(h.hoTen)}</div>
      ${h.lop ? `<div class="meta">Lớp ${esc(h.lop)}</div>` : ''}
      ${dvChu ? `<div class="meta small" style="margin-top:2px">${esc(dvChu)}</div>` : ''}</div>
      ${tong ? `<div class="amt">${tien(tong)}</div>` : ''}</div>`;
  };
  const a = trong.filter(khop).sort((x, y) => x.hoTen.localeCompare(y.hoTen, 'vi'));
  const b = khac.filter(khop).sort((x, y) => x.hoTen.localeCompare(y.hoTen, 'vi'));
  $('#noiDung').innerHTML = `
    <button class="btn full" id="themHS" style="margin-bottom:12px">+ Thêm học sinh mới</button>
    <input type="search" id="timHS" placeholder="Tìm theo tên..." value="${esc(timHS)}" style="margin-bottom:12px">
    <h2 style="margin-top:0">Đang dùng dịch vụ tháng ${thang} (${a.length})</h2>
    ${a.map(the).join('') || '<div class="empty">Không có</div>'}
    ${b.length ? `<details><summary>Không dùng dịch vụ tháng ${thang} / đã nghỉ (${b.length})</summary>${b.map(the).join('')}</details>` : ''}
    <button class="btn ghost full" style="margin-top:12px" onclick="taiDuLieu()">Tải lại dữ liệu</button>`;
  const o = $('#timHS');
  o.oninput = e => { timHS = e.target.value; const pos = o.selectionStart; veHocSinh(); const n = $('#timHS'); n.focus(); n.setSelectionRange(pos, pos); };
  $('#themHS').onclick = () => moSuaHocSinh(null);
  document.querySelectorAll('.item[data-id]').forEach(el => el.onclick = () => moSuaHocSinh(el.dataset.id));
}

/* ---------- Hồ sơ học sinh: thêm / sửa thông tin + dịch vụ ---------- */
const cuoiThangChu = t => { const [m, y] = t.split('/').map(Number); return pad(new Date(y, m, 0).getDate()) + '/' + pad(m) + '/' + y; };
const dauThangChu = t => '01/' + t;
const thangCuaNgay = chu => chu.slice(3);
let SHS = null;   // hồ sơ đang sửa

function cacThangChon() {
  return [...new Set(D.dsThang.concat([thangHienTai(), thang]))].sort((a, b) => soThang(b) - soThang(a));
}

function napDichVu() {
  const t = SHS.thang, id = SHS.id;
  const homNay = homNayChu();
  const batDauMacDinh = (!id && thangCuaNgay(homNay) === t) ? homNay : dauThangChu(t);
  SHS.dv = {};
  D.dichVu.forEach(d => {
    const dk = id ? D.dangKy.find(x => x.hsId === id && x.thang === t && x.maDv === d.ma) : null;
    SHS.dv[d.ma] = dk
      ? { chon: true, mucPhi: dk.mucPhi, tu: dk.tuNgay || dauThangChu(t), den: dk.denNgay || cuoiThangChu(t) }
      : { chon: false, mucPhi: d.mucPhi, tu: batDauMacDinh, den: cuoiThangChu(t) };
  });
  SHS.goc = JSON.stringify(SHS.dv);
}

function moSuaHocSinh(id, thangMo) {
  const h = id ? (D.hsTheoId[id] || { id }) : {};
  SHS = {
    id: id || '',
    info: { hoTen: h.hoTen || '', lop: h.lop || '', truong: h.truong || '', ngaySinh: h.ngaySinh || '', gioiTinh: h.gioiTinh || '',
            tenBo: h.tenBo || '', tenMe: h.tenMe || '', sdt: h.sdt || '', diaChi: h.diaChi || '', ghiChu: h.ghiChu || '' },
    thang: thangMo || (id ? thang : (D.dsThang.includes(thangHienTai()) ? thangHienTai() : thang)),
    apDungSau: true, moNghi: false
  };
  napDichVu();
  veSuaHocSinh();
  $('#modal').classList.add('show');
}

function docFormHS() {
  if (!$('#f_hoTen')) return;
  Object.keys(SHS.info).forEach(k => { const el = $('#f_' + k); if (el) SHS.info[k] = el.value.trim(); });
  if (SHS.info.ngaySinh && /^\d{4}-/.test(SHS.info.ngaySinh)) SHS.info.ngaySinh = isoSangChu(SHS.info.ngaySinh);
  D.dichVu.forEach(d => {
    const x = SHS.dv[d.ma]; if (!x) return;
    const cb = $(`#c_${d.ma}`); if (cb) x.chon = cb.checked;
    const g = $(`#g_${d.ma}`); if (g) x.mucPhi = Number(g.value || 0);
    const tu = $(`#t_${d.ma}`); if (tu && tu.value) x.tu = isoSangChu(tu.value);
    const den = $(`#d_${d.ma}`); if (den && den.value) x.den = isoSangChu(den.value);
  });
  const ap = $('#apDungSau'); if (ap) SHS.apDungSau = ap.checked;
}

function veSuaHocSinh() {
  const i = SHS.info, t = SHS.thang;
  const minI = chuSangIso(dauThangChu(t)), maxI = chuSangIso(cuoiThangChu(t));
  const thangSau = D.dsThang.filter(x => soThang(x) > soThang(t));
  const o = (k, nhan, kieu = 'text', them = '') => `<div><label class="f" for="f_${k}">${nhan}</label><input type="${kieu}" id="f_${k}" value="${esc(kieu === 'date' && i[k] ? chuSangIso(i[k]) : i[k])}" ${them}></div>`;
  const dvHtml = D.dichVu.map(d => {
    const x = SHS.dv[d.ma]; const theoNgay = d.cachTinh.toLowerCase() === 'theo ngày';
    return `<div class="card" style="padding:10px 12px;margin-bottom:8px;${x.chon ? 'border-color:var(--brand)' : ''}">
      <label class="row" style="cursor:pointer"><input type="checkbox" id="c_${d.ma}" ${x.chon ? 'checked' : ''} style="width:20px;height:20px">
        <span class="grow"><b>${esc(d.ten)}</b><br><span class="muted small">${theoNgay ? tien(d.mucPhi) + '/ngày có mặt' : tien(d.mucPhi) + '/tháng'}</span></span></label>
      ${x.chon ? `<div class="f3">
        <div><label class="f" for="g_${d.ma}">${theoNgay ? 'Giá 1 ngày' : 'Giá tháng này'}</label><input type="number" id="g_${d.ma}" value="${x.mucPhi}" inputmode="numeric" step="1000" min="0"></div>
        <div><label class="f" for="t_${d.ma}">Bắt đầu từ</label><input type="date" id="t_${d.ma}" value="${chuSangIso(x.tu)}" min="${minI}" max="${maxI}"></div>
        <div><label class="f" for="d_${d.ma}">Dùng đến</label><input type="date" id="d_${d.ma}" value="${chuSangIso(x.den)}" min="${minI}" max="${maxI}"></div>
      </div>` : ''}
    </div>`;
  }).join('');

  $('#modalNoiDung').innerHTML = `
    <div class="row"><h3 class="grow">${SHS.id ? esc(i.hoTen || SHS.id) : 'Thêm học sinh mới'}</h3><button class="btn ghost" onclick="dongModal()">Đóng</button></div>
    <h2>Thông tin</h2>
    <div class="f2">
      ${o('hoTen', 'Họ và tên *')}
      <div class="f2 in">${o('lop', 'Lớp')}${o('ngaySinh', 'Ngày sinh', 'date')}</div>
      ${o('truong', 'Trường')}
      <div><label class="f" for="f_gioiTinh">Giới tính</label><select id="f_gioiTinh" class="thang" style="width:100%;font-weight:400">
        ${['', 'Nam', 'Nữ'].map(g => `<option ${g === i.gioiTinh ? 'selected' : ''} value="${g}">${g || '—'}</option>`).join('')}</select></div>
      ${o('tenBo', 'Tên bố')}${o('tenMe', 'Tên mẹ')}
      ${o('sdt', 'SĐT phụ huynh (Zalo)', 'tel', 'inputmode="tel"')}${o('diaChi', 'Địa chỉ')}
    </div>
    ${o('ghiChu', 'Ghi chú')}

    <div class="row" style="margin-top:18px"><h2 class="grow" style="margin:0">Dịch vụ sử dụng</h2>
      <select id="thangDV" class="thang">${cacThangChon().map(x => `<option ${x === t ? 'selected' : ''}>${x}</option>`).join('')}</select></div>
    <p class="muted small" style="margin:6px 0 10px">Tích chọn dịch vụ em dùng trong tháng ${t}. Vào học hoặc nghỉ giữa tháng thì sửa ngày "Bắt đầu từ" / "Dùng đến". App tự áp quy tắc ngày 16.</p>
    ${dvHtml || '<div class="muted">Chưa có dịch vụ nào. Vào Cài đặt → Dịch vụ & giá để thêm.</div>'}
    ${thangSau.length ? `<label class="row small" style="margin:6px 0;cursor:pointer"><input type="checkbox" id="apDungSau" ${SHS.apDungSau ? 'checked' : ''} style="width:18px;height:18px">
      <span>Áp dụng giống vậy cho các tháng sau đã tạo (${thangSau.join(', ')})</span></label>` : ''}

    <button class="btn full" id="luuHS" style="margin-top:12px">${SHS.id ? 'Lưu thay đổi' : 'Lưu học sinh mới'}</button>

    ${SHS.id ? `
      <div class="row wrap" style="margin-top:10px">
        <button class="btn sec" id="thuTienHS">Thu tiền / Zalo</button>
        <button class="btn ghost" id="choNghi">Cho nghỉ học…</button>
        <button class="btn danger" id="xoaHS">Xóa</button>
      </div>
      ${SHS.moNghi ? `<div class="card" style="margin-top:10px;background:var(--warn-soft);border:0">
        <label class="f" for="ngayNghi" style="margin-top:0;color:var(--warn)">Em nghỉ học từ ngày nào? (ngày cuối cùng còn đi học)</label>
        <input type="date" id="ngayNghi" value="${chuSangIso(homNayChu())}">
        <p class="small" style="color:var(--warn);margin:6px 0">Tất cả dịch vụ sẽ dừng ở ngày này, các tháng sau không còn tính tiền. Nghỉ trong ngày 1–15: tính 50% dịch vụ tháng; từ ngày 16: tính đủ tháng. Tiền còn nợ vẫn được giữ.</p>
        <button class="btn full" id="xacNhanNghi" style="background:var(--warn)">Xác nhận cho nghỉ</button></div>` : ''}` : ''}
  `;

  document.querySelectorAll('[id^="c_"]').forEach(cb => cb.onchange = () => { docFormHS(); veSuaHocSinh(); });
  $('#thangDV').onchange = e => {
    docFormHS();
    if (JSON.stringify(SHS.dv) !== SHS.goc && !confirm('Dịch vụ tháng ' + SHS.thang + ' chưa lưu. Chuyển tháng sẽ bỏ thay đổi đó?')) { e.target.value = SHS.thang; return; }
    SHS.thang = e.target.value; napDichVu(); veSuaHocSinh();
  };
  $('#luuHS').onclick = luuHoSo;
  if (SHS.id) {
    $('#thuTienHS').onclick = () => moHocSinh(SHS.id);
    $('#choNghi').onclick = () => { docFormHS(); SHS.moNghi = !SHS.moNghi; veSuaHocSinh(); };
    $('#xoaHS').onclick = async () => {
      if (!confirm('Xóa hẳn học sinh này? (Chỉ xóa được khi em chưa có dịch vụ/tiền thu nào)')) return;
      await chay(() => goiApi('xoaHocSinh', { id: SHS.id }), 'Đã xóa học sinh');
      dongModal(); await taiDuLieu();
    };
    const xn = $('#xacNhanNghi'); if (xn) xn.onclick = choNghiHoc;
  }
}

async function luuHoSo() {
  docFormHS();
  if (!SHS.info.hoTen) { baoToast('Chưa nhập họ tên'); $('#f_hoTen').focus(); return; }
  const ds = [];
  for (const d of D.dichVu) {
    const x = SHS.dv[d.ma]; if (!x.chon) continue;
    if (chuSangNgay(x.den) < chuSangNgay(x.tu)) { baoToast(`${d.ten}: ngày "Dùng đến" phải sau ngày bắt đầu`, 4000); return; }
    ds.push({ maDv: d.ma, mucPhi: x.mucPhi, tuNgay: x.tu, denNgay: x.den });
  }
  const moi = !SHS.id;
  const doiDV = moi || JSON.stringify(SHS.dv) !== SHS.goc;
  if (moi && !ds.length && !confirm('Chưa chọn dịch vụ nào cho em này. Vẫn lưu?')) return;
  const kq = await chay(() => goiApi('luuHocSinh', { hs: Object.assign({ id: SHS.id }, SHS.info) }));
  SHS.id = kq.id;
  if (doiDV && (ds.length || !moi)) {
    await chay(() => goiApi('luuDangKyHocSinh', { hsId: SHS.id, thang: SHS.thang, ds, apDungThangSau: SHS.apDungSau }));
  }
  await taiDuLieu();
  dongModal();
  baoToast(moi ? `Đã thêm ${SHS.info.hoTen}` : 'Đã lưu');
}

async function choNghiHoc() {
  const v = $('#ngayNghi').value; if (!v) return;
  const ngay = isoSangChu(v), t = thangCuaNgay(ngay);
  if (SHS.thang !== t) { SHS.thang = t; napDichVu(); }
  const ds = [];
  D.dichVu.forEach(d => {
    const x = SHS.dv[d.ma]; if (!x.chon) return;
    if (chuSangNgay(x.tu) > chuSangNgay(ngay)) return;           // chưa bắt đầu thì bỏ
    const den = chuSangNgay(x.den) < chuSangNgay(ngay) ? x.den : ngay;
    ds.push({ maDv: d.ma, mucPhi: x.mucPhi, tuNgay: x.tu, denNgay: den });
  });
  if (!confirm(`Cho ${SHS.info.hoTen || SHS.id} nghỉ từ sau ngày ${ngay}?`)) return;
  await chay(() => goiApi('luuDangKyHocSinh', { hsId: SHS.id, thang: t, ds, apDungThangSau: true }), 'Đã cho nghỉ học');
  await taiDuLieu();
  dongModal();
}

/* ================== CÀI ĐẶT (kết nối + Dịch vụ & giá) ================== */
function veCaiDat() {
  const dvHtml = D ? D.dichVu.map(d => {
    const dung = D.dangKy.filter(x => x.maDv === d.ma && x.thang === thang).length;
    return `<div class="item" data-ma="${esc(d.ma)}"><div class="grow"><div class="name">${esc(d.ten)}</div>
      <div class="meta">${esc(d.cachTinh)} · ${dung} em dùng tháng ${thang}</div></div>
      <div class="amt">${tien(d.mucPhi)}<div class="muted small" style="font-weight:400">${d.cachTinh.toLowerCase() === 'theo ngày' ? '/ngày' : '/tháng'}</div></div></div>`;
  }).join('') : '';
  $('#noiDung').innerHTML = `
    ${D ? `<h2 style="margin-top:0">Dịch vụ & giá</h2>
      ${dvHtml}
      <button class="btn sec full" id="themDV" style="margin-bottom:6px">+ Thêm dịch vụ</button>
      <h2>Kết nối</h2>` : ''}
    <div class="card">
      <div class="name">Kết nối Google Sheet</div>
      <label class="f" for="url">Đường link Web App (kết thúc bằng /exec)</label>
      <input type="url" id="url" value="${esc(cauHinh.url || '')}" placeholder="https://script.google.com/macros/s/.../exec">
      <label class="f" for="key">Mã bảo vệ (giống MA_BAO_VE trong Code.gs)</label>
      <input type="password" id="key" value="${esc(cauHinh.key || '')}">
      <button class="btn full" id="luuCH" style="margin-top:14px">Lưu và kết nối</button>
      <p class="muted small">Link và mã chỉ lưu trên trình duyệt của máy này.</p>
    </div>
    ${D ? `<div class="card">
      <div class="name">Số dư ban đầu</div>
      <p class="muted small" style="margin:4px 0 10px">Dùng 1 lần khi mới chuyển dữ liệu cũ sang: ghi nhận là phụ huynh đã đóng đủ tiền của tất cả các tháng <b>trước</b> tháng chọn dưới đây. Khoản nào thực sự còn nợ thì sau đó xóa lần thu tương ứng của em đó.</p>
      <label class="f" for="moc">Đã thu đủ các tháng trước tháng</label>
      <select id="moc" class="thang" style="width:100%">${D.dsThang.slice().reverse().map(t => `<option>${t}</option>`).join('')}</select>
      <button class="btn sec full" id="soDu" style="margin-top:10px">Ghi nhận đã thu đủ</button>
    </div>` : ''}
    ${D ? `<div class="card small muted">Đang kết nối: ${D.hocSinh.length} học sinh · ${D.dsThang.length} tháng dữ liệu · ${D.thuTien.length} lần thu tiền</div>` : ''}`;
  $('#luuCH').onclick = async () => {
    cauHinh = { url: $('#url').value.trim(), key: $('#key').value };
    try { localStorage.setItem(LUU, JSON.stringify(cauHinh)); } catch (e) {}
    await taiDuLieu(false);
    manHinh = 'tongQuan'; ve();
    baoToast('Kết nối thành công');
  };
  const sd = $('#soDu');
  if (sd) sd.onclick = async () => {
    const moc = $('#moc').value;
    const ds = [];
    D.hocSinh.forEach(h => noCu(h.id, moc).forEach(x => ds.push({ thang: x.thang, hsId: h.id, soTien: x.thieu })));
    if (!ds.length) { baoToast('Các tháng trước ' + moc + ' không còn khoản nợ nào'); return; }
    const tong = ds.reduce((a, x) => a + x.soTien, 0);
    if (!confirm(`Ghi nhận đã thu ${tien(tong)} (${ds.length} khoản) cho các tháng trước ${moc}?`)) return;
    await chay(() => goiApi('thuTien', { ds, ngayThu: homNayChu(), ghiChu: 'Số dư ban đầu' }), 'Đã ghi nhận số dư ban đầu');
    await taiDuLieu();
  };
  const td = $('#themDV'); if (td) td.onclick = () => moSuaDichVu(null);
  document.querySelectorAll('.item[data-ma]').forEach(el => el.onclick = () => moSuaDichVu(el.dataset.ma));
}

function moSuaDichVu(ma) {
  const d = ma ? D.dvTheoMa[ma] : { ten: '', cachTinh: 'Theo tháng', mucPhi: 0, ghiChu: '' };
  const daDung = ma ? D.dangKy.some(x => x.maDv === ma) : false;
  const cacThang = cacThangChon();
  const macDinh = cacThang.includes(thangHienTai()) ? thangHienTai() : thang;
  $('#modalNoiDung').innerHTML = `
    <div class="row"><h3 class="grow">${ma ? 'Sửa dịch vụ' : 'Thêm dịch vụ'}</h3><button class="btn ghost" onclick="dongModal()">Đóng</button></div>
    <label class="f" for="dv_ten">Tên dịch vụ *</label><input type="text" id="dv_ten" value="${esc(d.ten)}" placeholder="Ví dụ: Bán trú tính tháng">
    <label class="f" for="dv_cach">Cách tính tiền</label>
    <select id="dv_cach" class="thang" style="width:100%;font-weight:400" ${daDung ? 'disabled' : ''}>
      <option ${d.cachTinh !== 'Theo ngày' ? 'selected' : ''}>Theo tháng</option><option ${d.cachTinh === 'Theo ngày' ? 'selected' : ''}>Theo ngày</option></select>
    ${daDung ? '<p class="muted small" style="margin:4px 0">Dịch vụ đã có học sinh dùng nên không đổi cách tính được.</p>' : '<p class="muted small" style="margin:4px 0">Theo ngày = đếm ngày có mặt trong Điểm danh × giá 1 ngày.</p>'}
    <label class="f" for="dv_gia">Giá mặc định (đồng)</label><input type="number" id="dv_gia" value="${d.mucPhi}" inputmode="numeric" step="1000" min="0">
    ${ma && daDung ? `<div id="apGia" style="display:none">
      <label class="f" for="dv_tu">Áp dụng giá mới cho các em đang dùng, từ tháng</label>
      <select id="dv_tu" class="thang" style="width:100%">${cacThang.map(t => `<option ${t === macDinh ? 'selected' : ''}>${t}</option>`).join('')}<option value="">Không đổi tháng nào (chỉ dùng cho đăng ký mới)</option></select>
      <p class="muted small" style="margin:4px 0">Các tháng trước vẫn giữ giá cũ. Em nào đang có giá riêng (khác giá cũ ${tien(d.mucPhi)}) thì giữ nguyên giá riêng.</p></div>` : ''}
    <label class="f" for="dv_gc">Ghi chú</label><input type="text" id="dv_gc" value="${esc(d.ghiChu || '')}">
    <button class="btn full" id="luuDV" style="margin-top:14px">Lưu</button>
    ${ma && !daDung ? '<button class="btn danger full" id="xoaDV" style="margin-top:8px">Xóa dịch vụ</button>' : ''}`;
  $('#modal').classList.add('show');
  const ap = $('#apGia');
  if (ap) $('#dv_gia').oninput = e => { ap.style.display = Number(e.target.value) !== d.mucPhi ? 'block' : 'none'; };
  $('#luuDV').onclick = async () => {
    const dv = { ma, laMoi: !ma, ten: $('#dv_ten').value.trim(), cachTinh: $('#dv_cach').value, mucPhi: Number($('#dv_gia').value || 0), ghiChu: $('#dv_gc').value.trim() };
    if (!dv.ten) { baoToast('Chưa nhập tên dịch vụ'); return; }
    if (ap && ap.style.display !== 'none') dv.apDungTuThang = $('#dv_tu').value;
    const kq = await chay(() => goiApi('luuDichVu', { dv }));
    await taiDuLieu(); dongModal();
    baoToast(kq.capNhat ? `Đã lưu · đổi giá cho ${kq.capNhat} đăng ký (${kq.thangTinhLai.join(', ')})` : 'Đã lưu dịch vụ', 4500);
  };
  const x = $('#xoaDV'); if (x) x.onclick = async () => {
    if (!confirm('Xóa dịch vụ này?')) return;
    await chay(() => goiApi('xoaDichVu', { ma }), 'Đã xóa'); await taiDuLieu(); dongModal();
  };
}

/* ================== KHỞI ĐỘNG ================== */
window.addEventListener('unhandledrejection', e => e.preventDefault());   // lỗi đã được báo bằng thông báo nhỏ
ve();
if (cauHinh.url) taiDuLieu(false).catch(() => {});
</script>
</body>
</html>
